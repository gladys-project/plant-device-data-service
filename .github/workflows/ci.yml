name: Plant device data service CI

'on':
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 / Maven verify
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      (github.event.pull_request.merged == true && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Require Docker for Kafka and MongoDB integration tests
        run: docker info
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.0
      - name: Verify Docker Compose availability
        run: docker compose version
      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate service Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build service image
        run: docker build --tag plant-device-data-service:ci .
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified application JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gladys-plant-device-data-service-${{ github.sha }}
          path: target/plant-device-data-service-*.jar
          if-no-files-found: error
          retention-days: 14
