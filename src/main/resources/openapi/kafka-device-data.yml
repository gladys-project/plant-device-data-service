openapi: 3.1.2
info:
  title: Gladys plant device data input
  version: 1.0.0
  description: Device-data projection for downstream device services; no sensor measurements
    or business decisions.
paths: {}
components:
  schemas:
    DeviceError:
      type: object
      additionalProperties: false
      required:
      - code
      - component
      - severity
      - message
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        component:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - ERROR
          - CRITICAL
          description: Initial v1 diagnostic severity vocabulary.
        message:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
    KafkaDeviceData:
      type: object
      additionalProperties: false
      description: Device diagnostics and original observation metadata projected
        from raw telemetry. Sensor measurements are intentionally excluded; deviceId
        remains the intended Kafka key.
      required:
      - schemaVersion
      - eventId
      - eventType
      - deviceId
      - bootId
      - sequence
      - uptimeMs
      - observedAt
      - clockSource
      - mock
      - batteryLevelPct
      - errors
      properties:
        schemaVersion:
          type: integer
          const: 1
        eventId:
          type: string
          format: uuid
          description: Identity of this observation; preserved across transport retries.
        eventType:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Original observation event type, preserved without interpretation.
        deviceId:
          type: string
          format: uuid
          description: Device identity and intended Kafka key.
        bootId:
          type: string
          format: uuid
          description: Identity of the device boot session.
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Nonnegative sequence within a boot session.
        uptimeMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Device uptime in milliseconds at observation.
        observedAt:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Observation time as Unix epoch milliseconds, not an RFC 3339
            string.
        clockSource:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Clock provenance, for example MANUAL_TEST. No closed vocabulary
            is established yet.
        mock:
          type: boolean
        batteryLevelPct:
          type: integer
          minimum: 0
          maximum: 100
        errors:
          type: array
          description: Device-reported diagnostics; may be empty. The bridge does
            not interpret them.
          items:
            $ref: '#/components/schemas/DeviceError'
